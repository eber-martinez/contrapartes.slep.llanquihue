:root{color-scheme:light;--ink:#233143;--muted:#738196;--line:#e3e9ef;--blue:#23679d;--paper:#f7f9fa;--green:#8fce38;--red:#ff3e56;--yellow:#f8d940;--cyan:#36b6e8}
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:var(--ink);font-family:Inter,system-ui,"Segoe UI",Arial,sans-serif;font-size:14px}button,select,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #40b8e9;outline-offset:2px}

.group{margin-bottom:23px}.grouphead{font-size:13px;color:#3c5066;font-weight:800;padding:0 0 11px;border-bottom:1px solid #e7ecf1;display:flex;align-items:center;gap:8px}.marker{width:5px;height:16px;background:var(--cyan);border-radius:4px}.marker.c{background:var(--green)}

Pvan6/29Q22WSTTW5R/gfiVlwlYbgtwwAAAABJRU5ErkJggg==" width="350" height="100" alt="Servicio Local de Educación Pública Llanquihue"></div><h1 class="title">Contrapartes de<br>Programas y Convenios</h1></header><div class="colors"><span style="background:var(--green)"></span><span style="background:var(--red)"></span><span style="background:var(--yellow)"></span><span style="background:var(--cyan)"></span></div><main class="content"><nav class="tabs" aria-label="Tipo de consulta"><button class="tab" data-mode="all" aria-selected="true">Todos</button><button class="tab" data-mode="p" aria-selected="false">Programas</button><button class="tab" data-mode="c" aria-selected="false">Convenios</button></nav><label class="caption" for="q">Buscar programa, convenio o institución</label><div class="inputwrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="m16 16 5 5"></path></svg><input id="q" type="search" placeholder="Ej. Patio Vivo, Proretención, Teatro del Lago…" autocomplete="off"></div><div class="suggestwrap"><div class="suggest" id="suggest" hidden></div></div><div class="tools"><div class="field"><label for="person">Contraparte SLEP · Búsqueda inversa</label><select id="person"><option value="">Seleccionar funcionario</option></select></div><button class="ghost" id="more" aria-expanded="false">+ Más filtros</button><button class="ghost minor" id="clear">Limpiar</button></div><div class="extended" id="extra" hidden><div class="field"><label for="unit">Unidad</label><select id="unit"><option value="">Todas las unidades</option><option>UATP</option><option>Gabinete</option><option>DAF</option><option>Bienestar</option><option value="other">Otra / por definir</option></select></div><div class="field"><label for="org">Institución</label><select id="org"><option value="">Todas las instituciones</option></select></div></div><div class="divider"></div><div class="results" id="results" aria-live="polite"></div><p class="foot"><span id="estadoDatos">Cargando información actualizada…</span></p></main></div><script>
const RECORDS=[];
(()=>{
const $=x=>document.getElementById(x),q=$('q'),staff=$('person'),un=$('unit'),org=$('org'),out=$('results'),sug=$('suggest');let mode='all';
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const members=d=>String(d.counterpart).split(';').map(x=>x.trim()).filter(x=>x&&!/^por (definir|confirmar)/i.test(x));
const unit=s=>['UATP','Gabinete','DAF','Bienestar'].find(x=>s.endsWith(' - '+x))||'other';
let names=[];
function actualizarFiltros(){
 const personaSeleccionada=staff.value, institucionSeleccionada=org.value;
 names=[...new Set(RECORDS.flatMap(members))].sort((a,b)=>a.localeCompare(b,'es'));
 const institutions=[...new Set(RECORDS.map(r=>r.institution))].sort((a,b)=>a.localeCompare(b,'es'));
 staff.replaceChildren(new Option('Seleccionar funcionario',''));
 for(const n of names)staff.add(new Option(n,n));
 org.replaceChildren(new Option('Todas las instituciones',''));
 for(const n of institutions)org.add(new Option(n,n));
 staff.value=names.includes(personaSeleccionada)?personaSeleccionada:'';
 org.value=institutions.includes(institucionSeleccionada)?institucionSeleccionada:'';
}
function hasQuery(){return q.value.trim()||staff.value||un.value||org.value;}
function filter(r){return (mode==='all'||r.t===mode)&&(!q.value.trim()||norm(r.title+' '+(r.description||'')+' '+r.institution+' '+r.counterpart).includes(norm(q.value.trim())))&&(!staff.value||members(r).includes(staff.value))&&(!un.value||(un.value==='other'?members(r).length===0||members(r).some(x=>unit(x)==='other'):members(r).some(x=>unit(x)===un.value)))&&(!org.value||org.value===r.institution);}
function rows(items,t){const arr=items.filter(r=>r.t===t);if(!arr.length)return '';return `<section class="group"><div class="grouphead"><i class="marker ${t==='c'?'c':''}"></i>${t==='p'?'Programas':'Convenios'}</div>${arr.map(r=>`<div class="record"><div><strong>${esc(r.title)}</strong><p>${esc(t==='p'?r.institution:r.description)}</p></div><div class="who">${members(r).length?members(r).map(n=>`<button data-person="${esc(n)}" title="Ver sus programas y convenios">${esc(n)}</button>`).join(''):`<span class="unknown">${esc(r.counterpart)}</span>`}</div></div>`).join('')}</section>`;}
function render(){if(!hasQuery()){out.innerHTML='<div class="start"><h3>Encuentra la contraparte de una iniciativa</h3><p>Escribe el nombre de un programa o institución, o elige una persona para consultar sus programas y convenios.</p></div>';return;}const found=RECORDS.filter(filter);let html='';if(staff.value){const pieces=staff.value.split(' - ');html+=`<div class="personhead"><div><span>CONTRAPARTE SLEP</span><h3>${esc(pieces[0])}</h3><small>${esc(pieces.slice(1).join(' - ')||'Unidad por confirmar')}</small></div><button type="button" data-close>Quitar selección ×</button></div>`;}html+=found.length?rows(found,'p')+rows(found,'c'):'<div class="empty">No se encontraron coincidencias. Modifica la búsqueda o limpia los filtros.</div>';out.innerHTML=html;}
function hide(){sug.hidden=true;sug.innerHTML='';}
function suggest(){const term=norm(q.value.trim());if(term.length<2||staff.value){hide();return;}const persons=names.filter(x=>norm(x).includes(term)).slice(0,3).map(x=>({title:x,desc:'Funcionario · Búsqueda inversa',person:x}));const candidates=RECORDS.filter(x=>(mode==='all'||mode===x.t)&&(norm(x.title).includes(term)||norm(x.institution).includes(term))).slice(0,6-persons.length).map(x=>({title:x.title,desc:x.t==='p'?x.institution:x.description}));const v=[...persons,...candidates];if(!v.length){hide();return;}sug.innerHTML=v.map((x,i)=>`<button type="button" data-id="${i}"><b>${esc(x.title)}</b><small>${esc(x.desc)}</small></button>`).join('');sug._items=v;sug.hidden=false;}
function setMode(m){mode=m;document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.mode===mode)));render();suggest();}
function choose(name){staff.value=name;q.value='';un.value='';org.value='';hide();setMode('all');}
document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));
q.addEventListener('input',()=>{staff.value='';render();suggest();});q.addEventListener('keydown',e=>{if(e.key==='Escape')hide();if(e.key==='Enter'&&!sug.hidden){e.preventDefault();sug.querySelector('button')?.click();}});
staff.addEventListener('change',()=>{q.value='';hide();if(staff.value)setMode('all');else render();});un.addEventListener('change',render);org.addEventListener('change',render);
$('more').addEventListener('click',()=>{const on=$('extra').hidden;$('extra').hidden=!on;$('more').textContent=on?'− Menos filtros':'+ Más filtros';$('more').setAttribute('aria-expanded',String(on));});
$('clear').addEventListener('click',()=>{q.value='';staff.value='';un.value='';org.value='';hide();setMode('all');q.focus();});
sug.addEventListener('click',e=>{const b=e.target.closest('[data-id]');if(!b)return;const x=sug._items[+b.dataset.id];if(x.person)choose(x.person);else{staff.value='';q.value=x.title;hide();render();}});
out.addEventListener('click',e=>{const b=e.target.closest('[data-person]');if(b)choose(b.dataset.person);if(e.target.closest('[data-close]')){staff.value='';render();}});
document.addEventListener('click',e=>{if(!e.target.closest('.suggestwrap')&&!e.target.closest('.inputwrap'))hide();});

// Es la misma arquitectura JSONP que utilizan los sitios PROGRAMAS y CONVENIOS.
const API_URL='https://script.google.com/a/macros/slepllanquihue.cl/s/AKfycby7sbNjLYZXsU6M_rkz5KULOKQeBm-qdKGv3q27oyz4LSf29tadWHMfILkGwzQW_ir9/exec';
let consultando=false,datosEnVivo=false,respaldoCargado=false;
const estado=$('estadoDatos');
function usarDatos(payload){
 if(!payload||!Array.isArray(payload.programas)||!Array.isArray(payload.convenios)){
  throw new Error('Apps Script no entregó las pestañas PROGRAMAS y CONVENIOS en el formato esperado.');
 }
 const nuevos=[
  ...payload.programas.map((r,i)=>({t:'p',title:String(r.programa||''),institution:String(r.institucion||''),counterpart:String(r.contraparte||''),description:'',id:'p-'+i})),
  ...payload.convenios.map((r,i)=>({t:'c',title:String(r.institucion||''),institution:String(r.institucion||''),description:String(r.sintesis||''),counterpart:String(r.contraparte||''),id:'c-'+i}))
 ].filter(r=>r.title.trim());
 if(!nuevos.length)throw new Error('La fuente no contiene registros para mostrar.');
 const firma=JSON.stringify(nuevos);
 if(firma!==window._ultimaFirmaSlep){
  window._ultimaFirmaSlep=firma;
  RECORDS.splice(0,RECORDS.length,...nuevos);
  actualizarFiltros();
  render();
 }
}
async function cargarRespaldo(){
 if(respaldoCargado||datosEnVivo)return;
 respaldoCargado=true;
 try{
  const response=await fetch('./datos.json?respaldo='+Date.now(),{cache:'no-store'});
  if(!response.ok)throw new Error('No está disponible el respaldo de datos.json.');
  if(datosEnVivo)return;
  usarDatos(await response.json());
  estado.textContent='Conexión en vivo no disponible · mostrando copia de respaldo. Los cambios en Google Sheets aún no se reflejan.';
 }catch(err){
  if(!datosEnVivo){
   estado.textContent='No se pudieron cargar los datos. Revisa el acceso de Apps Script.';
   out.innerHTML='<div class="empty">No se pudieron cargar las contrapartes. Revisa la conexión de Apps Script y el acceso a Google.</div>';
  }
  console.error('No se pudo recuperar la copia de respaldo:',err);
 }
}
function cargarDatos(){
 if(consultando)return;
 consultando=true;
 const callback='__slepContrapartesCallback_'+Date.now()+'_'+Math.floor(Math.random()*1000000);
 const script=document.createElement('script');
 let completo=false;
 let espera;
 const limpiar=()=>{
  if(completo)return false;
  completo=true;consultando=false;
  clearTimeout(espera);
  script.remove();
  try{delete window[callback]}catch(e){window[callback]=undefined}
  return true;
 };
 const fallo=err=>{
  if(!limpiar())return;
  console.warn('No hay acceso a Apps Script desde esta página:',err);
  if(datosEnVivo){
   estado.textContent='No se pudo comprobar la actualización; se mantienen los últimos datos recibidos de Google Sheets.';
  }else{
   estado.textContent='Comprobando conexión · esperando respuesta de Google Sheets…';
   cargarRespaldo();
  }
 };
 window[callback]=payload=>{
  if(completo)return;
  try{
   usarDatos(payload);
   datosEnVivo=true;
   estado.textContent='Datos actualizados desde Google Sheets · lectura directa mediante Apps Script';
   limpiar();
  }catch(err){fallo(err)}
 };
 script.onerror=()=>fallo(new Error('La aplicación web no es accesible desde GitHub Pages.'));
 script.src=API_URL+'?callback='+encodeURIComponent(callback)+'&_='+Date.now();
 script.async=true;
 espera=setTimeout(()=>fallo(new Error('Apps Script no respondió en 12 segundos.')),12000);
 document.head.appendChild(script);
}
out.innerHTML='<div class="start"><h3>Consultando el Google Sheet…</h3><p>Recuperando programas, convenios y contrapartes vigentes.</p></div>';
cargarDatos();
// Volver a consultar la planilla mientras el sitio permanece abierto.
setInterval(cargarDatos,120000);
})();
</script></body></html>
